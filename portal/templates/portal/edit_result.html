{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Edit Result</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Student Selection -->
        <div class="mb-3">
            <label for="student" class="form-label">Student (Registration Number)</label>
            <select name="student" id="student" class="form-select" required>
                {% for student in students %}
                <option value="{{ student.id }}" {% if student.id == result.student.id %}selected{% endif %}>
                    {{ student.reg_number }} — {{ student.user.get_full_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Course Selection -->
        <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select name="course" id="course" class="form-select" required>
                {% for course in courses %}
                <option value="{{ course.id }}" {% if course.id == result.course.id %}selected{% endif %}>
                    {{ course.code }} — {{ course.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Semester Selection -->
        <div class="mb-3">
            <label for="semester" class="form-label">Semester</label>
            <select name="semester" id="semester" class="form-select" required>
                {% for semester in semesters %}
                <option value="{{ semester.id }}" {% if semester.id == result.semester.id %}selected{% endif %}>
                    {{ semester.name }} ({{ semester.year }})
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Marks Input -->
        <div class="mb-3">
            <label for="marks" class="form-label">Marks</label>
            <input type="number" step="0.01" name="marks" id="marks" class="form-control" value="{{ result.marks }}" required>
        </div>

        <!-- Manual GPA Input -->
        <div class="mb-3">
            <label for="manual_gpa" class="form-label">GPA (Manual Entry)</label>
            <input type="number" step="0.01" name="manual_gpa" id="manual_gpa" class="form-control" value="{{ result.manual_gpa|default:'' }}" required>
            <small class="text-muted">Grade will be set automatically from GPA.</small>
        </div>

        <button type="submit" class="btn btn-primary">
            Update Result
        </button>
    </form>
</div>

{% endblock %}
