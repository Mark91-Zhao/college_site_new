{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Add Result</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Hidden Student & Semester -->
        <input type="hidden" name="student" value="{{ student.id }}">
        <input type="hidden" name="semester" value="{{ semester.id }}">

        <!-- Display context info -->
        <div class="mb-3">
            <p><strong>Student:</strong> {{ student.reg_number }} — {{ student.user.get_full_name }}</p>
            <p><strong>Semester:</strong> {{ semester.name }} ({{ semester.year }})</p>
        </div>

        <!-- Course Selection (filtered by semester) -->
        <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select name="course" id="course" class="form-select" required>
                {% for course in courses %}
                <option value="{{ course.id }}">{{ course.code }} — {{ course.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Marks Input -->
        <div class="mb-3">
            <label for="marks" class="form-label">Marks</label>
            <input type="number" step="0.01" name="marks" id="marks" class="form-control" required>
        </div>

        <!-- GPA Input (Required) -->
        <div class="mb-3">
            <label for="manual_gpa" class="form-label">GPA</label>
            <input type="number" step="0.01" min="0" max="4.00"
                   name="manual_gpa" id="manual_gpa"
                   class="form-control" required>
            <small class="text-muted">Enter GPA between 0.00 and 4.00</small>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Result
        </button>
    </form>
</div>

{% endblock %}
