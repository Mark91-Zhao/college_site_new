{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Add Result</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Student Selection -->
        <div class="mb-3">
            <label for="student" class="form-label">Student (Registration Number)</label>
            <select name="student" id="student" class="form-select" required>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.reg_number }} — {{ student.user.get_full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Semester Selection -->
        <div class="mb-3">
            <label for="semester" class="form-label">Semester</label>
            <select name="semester" id="semester" class="form-select" required>
                <option value="">-- Select Semester --</option>
                {% for semester in semesters %}
                <option value="{{ semester.id }}">{{ semester.name }} ({{ semester.year }})</option>
                {% endfor %}
            </select>
        </div>

        <!-- Course Selection (filtered by semester) -->
        <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select name="course" id="course" class="form-select" required>
                <!-- Options will be populated dynamically -->
            </select>
        </div>

        <!-- Marks Input -->
        <div class="mb-3">
            <label for="marks" class="form-label">Marks</label>
            <input type="number" step="0.01" name="marks" id="marks" class="form-control" required>
        </div>

        <!-- GPA Input (Required) -->
        <div class="mb-3">
            <label for="manual_gpa" class="form-label">GPA</label>
            <input type="number" step="0.01" min="0" max="4.00"
                   name="manual_gpa" id="manual_gpa"
                   class="form-control" required>
            <small class="text-muted">Enter GPA between 0.00 and 4.00</small>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Result
        </button>
    </form>
</div>

<!-- ✅ AJAX script to filter courses -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const semesterSelect = document.getElementById("semester");
    const courseSelect = document.getElementById("course");

    semesterSelect.addEventListener("change", function() {
        const semesterId = this.value;
        if (!semesterId) {
            courseSelect.innerHTML = "";
            return;
        }

        fetch(`/portal/get_courses/${semesterId}/`)
            .then(response => response.json())
            .then(data => {
                courseSelect.innerHTML = "";
                data.forEach(course => {
                    const option = document.createElement("option");
                    option.value = course.id;
                    option.textContent = `${course.code} — ${course.name}`;
                    courseSelect.appendChild(option);
                });
            });
    });
});
</script>

{% endblock %}
