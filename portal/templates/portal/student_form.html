{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'student_list' %}">Students</a></li>
            <li class="breadcrumb-item active" aria-current="page">Student Form</li>
        </ol>
    </nav>

    <h2 class="text-success">Student Form</h2>
    <p class="lead">Add or edit student details below.</p>

    <form method="post" class="mt-3">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="id_reg_number" class="form-label">Registration Number</label>
            {{ form.reg_number }}
        </div>

        <div class="mb-3">
            <label for="id_program" class="form-label">Program</label>
            {{ form.program }}
        </div>

        <div class="mb-3">
            <label for="id_year" class="form-label">Year</label>
            {{ form.year }}
        </div>

        <div class="mb-3">
            <label for="id_phone_number" class="form-label">Phone Number</label>
            {{ form.phone_number }}
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
