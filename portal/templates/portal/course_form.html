{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Course Form</li>
        </ol>
    </nav>

    <h2 class="text-success">Course Form</h2>
    <p class="lead">Add or edit course details below.</p>

    <form method="post" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_code" class="form-label">Course Code</label>
            {{ form.code }}
        </div>

        <div class="mb-3">
            <label for="id_name" class="form-label">Course Name</label>
            {{ form.name }}
        </div>

        <div class="mb-3">
            <label for="id_credit_hours" class="form-label">Credit Hours</label>
            {{ form.credit_hours }}
        </div>

        <div class="mb-3">
            <label for="id_semester" class="form-label">Semester</label>
            {{ form.semester }}
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
